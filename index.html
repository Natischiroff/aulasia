<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aula 01 - Chat com Ollama</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Chat com Ollama</h1>

    <input id="pergunta" aria-label="Sua mensagem" placeholder="Digite sua mensagem..." autocomplete="off" required>
    <button id="enviar">Enviar</button>
  </form>

  <script src="script.js"></script>
</body>
</html>
